name: CodeQL

# Static analysis of the Go code with CodeQL. This workflow is the repository's
# CodeQL configuration: repo-level "default setup" is deliberately not enabled,
# since the two cannot both be active and a workflow keeps the query suite, the
# build and the action pins reviewable in the tree.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries in the pinned CodeQL bundle are applied to code that
    # has not changed recently.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          # Manual rather than autobuild, so the extractor observes exactly the
          # build CI already gates on and nothing inferred from the Makefile.
          build-mode: manual
      - name: Build
        run: go build ./...
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
