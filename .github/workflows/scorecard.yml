name: Scorecard supply-chain security

# OpenSSF Scorecard: scores the repository's supply-chain posture (pinned
# dependencies, token permissions, branch protection, ...) and publishes the
# result to the public Scorecard API and the code-scanning dashboard.
#
# Scorecard only analyses the default branch, so this does not run on pull
# requests. With publish_results enabled the Scorecard service verifies this
# workflow's shape, so keep it minimal: no workflow-level write permissions, no
# workflow- or job-level env/defaults, no services/containers, and only the
# steps below.
on:
  # Part of Scorecard's recommended trigger set. It fires only on classic
  # branch-protection rule changes; main is protected by a repository ruleset,
  # which has no workflow trigger, so ruleset changes are re-scored by the next
  # push to main or the weekly schedule instead.
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Request the OIDC token that authenticates publish_results.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker action: its action.yaml runs docker://ghcr.io/ossf/scorecard-action:<version>,
      # a mutable image tag, so this commit pin does not pin the executed image. That is
      # upstream's design and the publishing verifier allows no other layout; a Dependabot
      # bump of this pin moves the image tag with it.
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
